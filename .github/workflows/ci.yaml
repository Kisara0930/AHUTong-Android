name: Android host and plugins CI

on:
  push:
    branches: [master, main, develop, "p/**"]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "develop"
        type: string

permissions:
  contents: read

concurrency:
  group: android-plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify independent plugins and host
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Checkout selected branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize only required native repositories
        run: |
          git submodule sync -- sdk GuiXu-Rust
          git submodule update --init --depth 1 sdk GuiXu-Rust
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;37.0.0" "ndk;28.2.13676358"
      - name: Configure NDK and wrapper
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          chmod +x ./gradlew
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Cache Cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            sdk
            GuiXu-Rust
      - name: Test AHUP tooling and read-only market/update APIs
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s server/plugin-market -v
      - name: Test each native domain and legacy compatibility
        run: python3 scripts/ci_plugin_build.py rust-tests
      - name: Build and inspect independent arm64 native libraries
        run: python3 native/build_domains.py --abi arm64-v8a
      - name: Generate ephemeral CI signing identity
        # Throwaway JKS in RUNNER_TEMP; only the checkout public trust asset changes.
        # Repository/user/release signing configurations are never read.
        run: python3 scripts/ci_plugin_build.py prepare-signing
      - name: Build and sign every AHUP
        run: python3 scripts/ci_plugin_build.py plugins
      - name: Run host, shared SDK and plugin unit tests
        run: python3 scripts/ci_plugin_build.py tests
      - name: Build and lint the distributable host in both variants
        run: python3 scripts/ci_plugin_build.py host
      - name: Verify and collect CI-only APKs and plugins
        run: python3 scripts/ci_plugin_build.py collect
      - name: Verify no local signing material is tracked
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          bad = [name for name in tracked if name and (
              pathlib.PurePosixPath(name).suffix.lower() in {".jks", ".keystore", ".p12", ".pfx"}
              or pathlib.PurePosixPath(name).name in {"keystore.properties", "local.properties", "config.local.json"})]
          if bad:
              raise SystemExit("Local signing/configuration files must not be tracked: " + ", ".join(bad))
          PY
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AHUTong-test-and-lint-reports
          path: |
            host/build/reports/
            core/*/build/reports/
            data/*/build/reports/
            plugins/*/build/reports/
            native/build/logs/
          if-no-files-found: warn
      - name: Upload CI-only host APKs and all plugins
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AHUTong-host-and-plugins-CI-ONLY
          path: artifacts/ci/
          if-no-files-found: error
